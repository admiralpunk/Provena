[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "provena-agent-memory"
version = "0.1.11"
description = "Evidence-backed memory for AI agents"
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aniket Kolte" }]
keywords = ["ai-agents", "memory", "mcp", "provenance", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "openai>=2,<3",
  "pgvector>=0.3,<1",
]
release = ["build>=1.2,<2", "setuptools>=75", "twine>=6,<7", "wheel>=0.45"]
test = [
  "pytest>=8,<10",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "openai>=2,<3",
  "pgvector>=0.3,<1",
]

[project.urls]
Homepage = "https://github.com/admiralpunk/Provena"
Documentation = "https://github.com/admiralpunk/Provena#readme"
Repository = "https://github.com/admiralpunk/Provena.git"
Issues = "https://github.com/admiralpunk/Provena/issues"

[project.scripts]
provena = "provena.cli:main"
provena-mcp = "provena.integrations.mcp_server:main"
provena-codex-capture = "provena.integrations.capture_hook:main"
provena-codex-retrieve = "provena.integrations.context_hook:main"
provena-agent-capture = "provena.integrations.capture_hook:main"
provena-agent-context = "provena.integrations.context_hook:main"

[tool.setuptools]
packages = [
  "provena",
  "provena.core",
  "provena.integrations",
  "provena.memory",
  "provena.persistence",
  "provena.web",
]
package-dir = {provena = "src"}

[tool.setuptools.package-data]
provena = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
