services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: provena
      POSTGRES_USER: provena
      POSTGRES_PASSWORD: provena_dev
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provena"]
      interval: 2s
      timeout: 2s
      retries: 15

  ollama:
    image: ollama/ollama:0.34.2
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
