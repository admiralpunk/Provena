services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: provena
      POSTGRES_USER: provena
      POSTGRES_PASSWORD: provena_dev
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provena"]
      interval: 2s
      timeout: 2s
      retries: 15

