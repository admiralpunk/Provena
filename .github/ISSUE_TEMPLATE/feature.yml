name: Feature request
description: Propose a concrete Provena workflow or improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow or problem
      description: Describe the agent or operator workflow that is currently difficult.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Provenance or security considerations
      description: Note any effects on evidence, authority, scope, review, or tenant isolation.
