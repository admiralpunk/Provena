name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/assets/provena-console.gif"
      - "docs/assets/provena-social-preview.png"
      - "frontend/public/logo.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp frontend/public/logo.svg _site/logo.svg
          cp docs/assets/provena-console.gif _site/provena-console.gif
          cp docs/assets/provena-social-preview.png _site/social-preview.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
