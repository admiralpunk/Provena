name: CI

on:
  pull_request:
  push:
    branches: [master, task/mvp-phase-1]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: provena_test
          POSTGRES_USER: provena
          POSTGRES_PASSWORD: provena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provena -d provena_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://provena:provena_test@127.0.0.1:5432/provena_test
      TEST_DATABASE_URL: postgresql+psycopg://provena:provena_test@127.0.0.1:5432/provena_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: python scripts/check_release.py
      - run: python scripts/check_docs_links.py

  system-postgres:
    # ADR 0026: the Docker-free mode is supported only for PostgreSQL versions this job passes.
    name: System PostgreSQL ${{ matrix.postgres }} (no Docker)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    env:
      PROVENA_PG_BINDIR: /usr/lib/postgresql/${{ matrix.postgres }}/bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL and pgvector from the PostgreSQL apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.postgres }}" "postgresql-${{ matrix.postgres }}-pgvector"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Start a private cluster with Provena's own code
        run: |
          url=$(python -m provena.local_server "$RUNNER_TEMP/provena-state" | python -c 'import json,sys; print(json.load(sys.stdin)["database_url"])')
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  distribution:
    name: Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel as an MCP tool
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m pip install "${wheel}"
          provena --version
          python -c "import provena.integrations.mcp_server"

  compose:
    name: Release Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml -f deploy/compose.ollama.yaml config --quiet
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml -f deploy/compose.host-ollama.yaml config --quiet
      # Build the API image so packaging changes that break the container fail here, not at release.
      - run: docker build --tag provena-server:ci .
      - run: docker run --rm --entrypoint python provena-server:ci -c "import provena.api, provena.local_server; print(provena.local_server.migrations_location())"
