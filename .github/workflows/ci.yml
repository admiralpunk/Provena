name: CI

on:
  pull_request:
  push:
    branches: [master, task/mvp-phase-1]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: provena_test
          POSTGRES_USER: provena
          POSTGRES_PASSWORD: provena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provena -d provena_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://provena:provena_test@127.0.0.1:5432/provena_test
      TEST_DATABASE_URL: postgresql+psycopg://provena:provena_test@127.0.0.1:5432/provena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: python scripts/check_release.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  distribution:
    name: Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel as an MCP tool
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m pip install "${wheel}"
          provena --version
          python -c "import provena.integrations.mcp_server"

  compose:
    name: Release Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml -f deploy/compose.ollama.yaml config --quiet
